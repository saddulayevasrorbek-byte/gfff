<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- START SCREEN -->
  <div class="screen" id="start-screen">
    <div class="card">
      <div class="emoji">🧠</div>
      <h1>General Knowledge Quiz</h1>
      <p>Test your knowledge with <strong>10 questions</strong> across science, history, and culture.</p>
      <ul class="info-list">
        <li>⏱ No time limit</li>
        <li>✅ Instant feedback</li>
        <li>🏆 Score tracked</li>
      </ul>
      <button class="btn" id="start-btn">Start Quiz</button>
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div class="screen hidden" id="quiz-screen">
    <div class="card quiz-card">
      <div class="meta">
        <span id="question-counter">Question 1 / 10</span>
        <span id="score-display">Score: 0</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <h2 id="question-text">Question goes here</h2>
      <div class="answers" id="answers-container"></div>
      <div class="feedback hidden" id="feedback"></div>
      <button class="btn next-btn hidden" id="next-btn">Next Question →</button>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div class="screen hidden" id="result-screen">
    <div class="card">
      <div class="emoji" id="result-emoji">🏆</div>
      <h1>Quiz Complete!</h1>
      <p id="result-message"></p>
      <div class="final-score" id="final-score"></div>
      <button class="btn" id="restart-btn">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
